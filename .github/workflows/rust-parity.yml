name: Rust clock parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --manifest-path consumer-smoke/Cargo.toml -- --check
      - run: cargo run --manifest-path consumer-smoke/Cargo.toml --offline
      - run: cargo clippy --manifest-path consumer-smoke/Cargo.toml --all-targets --offline -- -D warnings
      - run: cargo check --no-default-features --lib
      - run: cargo clippy --no-default-features --lib -- -D warnings
